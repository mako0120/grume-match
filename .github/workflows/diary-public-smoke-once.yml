name: Diary production HTTP smoke (read-only, one-shot)

on:
  push:
    branches: [codex/diary-ops-final-hardening-20261027]
    paths: [.github/workflows/diary-public-smoke-once.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public pages and anonymous access denial (no data submitted)
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://brilliant-custard-364003.netlify.app';
          const paths = ['/diary', '/diary/request', '/diary/ops'];
          let errors = 0;
          for (const path of paths) {
            try {
              const r = await fetch(origin + path, { signal: AbortSignal.timeout(12000), redirect: 'follow' });
              console.log(path, 'HTTP', r.status, 'final-origin', new URL(r.url).origin);
              if (r.status !== 200 || new URL(r.url).origin !== origin) errors++;
              await r.body?.cancel();
            } catch (e) {
              console.log(path, 'transport-error', e?.name || 'unknown');
              errors++;
            }
          }
          // No identity token: this route MUST NEVER return customer data.
          try {
            const r = await fetch(origin + '/.netlify/functions/diary-ops-feed', {
              signal: AbortSignal.timeout(12000), redirect: 'manual',
              headers: { Accept: 'application/json' },
            });
            console.log('anonymous owner feed HTTP', r.status);
            if (![401, 403, 503].includes(r.status)) errors++;
            await r.body?.cancel();
          } catch (e) {
            console.log('anonymous feed transport-error', e?.name || 'unknown');
            errors++;
          }
          if (errors) throw Error('Read-only production HTTP smoke failed: ' + errors + ' failed checks');
          console.log('Read-only HTTP smoke passed. Real form submissions and admin E2E still UNTESTED.');
          NODE
