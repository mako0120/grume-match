name: Next.js security upgrade (one-shot)

on:
  push:
    branches:
      - codex/diary-ops-final-hardening-20261027
    paths:
      - .github/workflows/next-security-bump.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.repository == 'mako0120/grume-match' && github.ref == 'refs/heads/codex/diary-ops-final-hardening-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate official npm lockfile for security-patched Next.js
        run: npm install next@16.4.3 eslint-config-next@16.4.3 --save-exact
      - name: Verify clean dependency installation
        run: npm ci
      - name: Fail if any production high/critical advisory remains
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck and tests
        run: npm run typecheck && npm run lint && npm run test
      - name: Compile
        run: npm run build
      - name: Commit only verified dependency version and lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): upgrade Next.js and ESLint config to 16.4.3"
            git push origin HEAD:refs/heads/codex/diary-ops-final-hardening-20261027
          fi
