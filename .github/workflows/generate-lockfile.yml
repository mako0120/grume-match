name: Generate package lock

on:
  push:
    branches:
      - codex/pr-os-foundation
    paths:
      - .github/lockfile-trigger

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr-os-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore: add deterministic npm lockfile"
            git push origin HEAD:codex/pr-os-foundation
          fi
