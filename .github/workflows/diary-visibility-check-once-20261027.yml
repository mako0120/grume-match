name: Diary visibility check (read-only, one-shot)
on:
  push:
    branches: [feat/gurume-diary-direct-pr]
    paths: [.github/workflows/diary-visibility-check-once-20261027.yml]
permissions:
  contents: read
jobs:
  public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check anonymous access from GitHub runner
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://brilliant-custard-364003.netlify.app';
          const paths = ['/diary', '/diary/request', '/.netlify/functions/diary-ops-feed'];
          for (const path of paths) {
            try {
              const response = await fetch(origin + path, {
                redirect: 'manual', signal: AbortSignal.timeout(12000),
                headers: { Accept: path.includes('functions') ? 'application/json' : 'text/html' },
              });
              console.log(JSON.stringify({
                path, status: response.status,
                redirectOrigin: response.headers.has('location')
                  ? (new URL(response.headers.get('location'), origin).origin) : null,
                wwwAuthenticate: Boolean(response.headers.get('www-authenticate')),
                server: response.headers.get('server') || '',
              }));
              await response.body?.cancel();
            } catch (error) {
              console.log(JSON.stringify({ path, error: error?.name || 'request_failed' }));
            }
          }
          NODE
