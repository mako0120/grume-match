name: One-shot anonymous PR landing HTTP verification
on:
  push:
    branches: [codex/diary-pr-public-check-20261108]
    paths: [.github/workflows/diary-pr-http-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public pages and anonymous admin denial
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://brilliant-custard-364003.netlify.app';
          const locations = ['/diary/pr', '/diary/request', '/.netlify/functions/diary-ops-feed'];
          for (const path of locations) {
            try {
              const res = await fetch(origin+path,{
                redirect:'manual',signal:AbortSignal.timeout(15000),
                headers:{Accept:path.includes('functions')?'application/json':'text/html'}
              });
              console.log(JSON.stringify({
                path,status:res.status,
                redirectOrigin:res.headers.get('location')?
                  new URL(res.headers.get('location'),origin).origin:null,
                server:res.headers.get('server')||'',
                challenge:Boolean(res.headers.get('www-authenticate')),
              }));
              await res.body?.cancel();
            } catch(e) {
              console.log(JSON.stringify({path,error:e?.name||'transport_error'}));
            }
          }
          NODE
