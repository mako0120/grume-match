<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>グルメ日誌 PR相談フォーム登録用</title><meta name="robots" content="noindex,nofollow"></head>
<body>
<!-- Netlify/OpenNext builds need this physical HTML file for Netlify Forms discovery.
     This is not a public inquiry page. Data is submitted from /diary/request. -->
<form name="diary-pr-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="diary-pr-inquiry">
  <input type="text" name="bot-field">
  <input name="inquiry_kind">
  <input name="restaurant_name">
  <input name="contact_name">
  <input type="email" name="email">
  <input name="service">
  <input name="goal">
  <input name="featured_menu">
  <input name="visit_preference">
  <textarea name="message"></textarea>
  <input name="consent">
  <input name="compliance_confirmed">
</form>
</body>
</html>
